name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ancre
          POSTGRES_PASSWORD: ancre_dev_pw
          POSTGRES_DB: ancremail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ancre"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ancre:ancre_dev_pw@localhost:5432/ancremail_test?schema=public
      APP_URL: http://localhost:3000
      MAIL_DOMAIN: agents.test
      MAIL_PROVIDER: mock
      INBOUND_WEBHOOK_SECRET: ci-inbound-secret-0123456789abcdef012345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
