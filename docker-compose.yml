# Lancement local complet : docker compose up --build  → http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ancre
      POSTGRES_PASSWORD: ancre_dev_pw
      POSTGRES_DB: ancremail
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ancre"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ancre:ancre_dev_pw@db:5432/ancremail?schema=public
volumes:
  pgdata:
